<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
    input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-top: 10px; }
    .result { margin-top: 20px; padding: 10px; background: #eef; }
    .error { margin-top: 20px; padding: 10px; background: #fee; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form action="/shorten" method="post">
    <input type="text" name="url" placeholder="https://example.com/very/long/link" required>
    <button type="submit">Shorten</button>
  </form>

  {% if short_url %}
  <div class="result">
    Short link: <a href="{{ short_url }}">{{ short_url }}</a>
  </div>
  {% endif %}

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
</body>
</html>
